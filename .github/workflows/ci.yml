name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore VrCommand.slnx --locked-mode
      - run: dotnet build VrCommand.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/VrCommand.Checks --configuration Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/smoke_api.py
      - run: python scripts/smoke_world.py
      - run: python -m unittest discover -s tests -p test_pose_trace_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_input_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_heartbeat.py
      - run: python -m unittest discover -s tests -p test_pose_loop_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_process_timing.py
      - run: python -m unittest discover -s tests -p test_desktop_capacity.py
      - run: python -m unittest discover -s tests -p test_desktop_active.py
      - run: python -m unittest discover -s tests -p test_desktop_artifacts.py
      - run: python -m py_compile scripts/start-desktop-demo.py scripts/start-desktop-venue.py scripts/check-desktop-practice.py scripts/check-desktop-pose-input.py scripts/analyze-pose-input.py scripts/pose-heartbeat.py scripts/pose-process-timing.py scripts/analyze-process-timing.py scripts/check-desktop-capacity.py scripts/check-desktop-active.py scripts/check-desktop-debrief.py
      - run: python -m unittest discover -s tests -p test_desktop_debrief.py
      - run: python -m unittest discover -s tests -p test_udp_gate.py
      - run: python -m py_compile scripts/udp_gate.py scripts/check-desktop-end-race.py
      - run: python -m py_compile scripts/check-desktop-clock.py
      - run: python -m unittest discover -s tests -p test_venue_http_gate.py
      - run: python -m py_compile scripts/venue_http_gate.py scripts/check-desktop-clock-faults.py
      - run: python -m unittest discover -s tests -p test_desktop_long.py
      - run: python -m py_compile scripts/check-desktop-long.py scripts/check-desktop-seal-faults.py
      - run: python scripts/generate-weather-audio.py --check
      - run: python scripts/generate-combat-audio.py --check
      - run: python scripts/generate-field-props.py --check
      - run: python scripts/generate-service-rifle.py --check
      - run: python scripts/generate-combatants.py --check
      - run: python scripts/generate-weapon-actions.py --check
      - run: python scripts/generate-armed-combatants.py --check
      - run: python scripts/generate-combat-effects.py --check
      - run: python scripts/generate-player-fire.py --check
      - run: python scripts/generate-player-body.py --check
      - run: python scripts/check-transport-patch.py
      - run: python scripts/check-mission-font.py
      - run: python -m py_compile scripts/check-desktop-briefing.py
      - run: python -m py_compile scripts/check-desktop-readiness.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tests/browser install --frozen-lockfile
      - run: pnpm --dir tests/browser exec playwright install --with-deps chromium
      - run: pnpm --dir tests/browser test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: artifacts/console/
          if-no-files-found: ignore
