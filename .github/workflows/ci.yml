name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore VrCommand.slnx --locked-mode
      - run: dotnet build VrCommand.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/VrCommand.Checks --configuration Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/smoke_api.py
      - run: python scripts/smoke_world.py
      - run: python scripts/smoke_control_pipe.py
      - run: python scripts/check-hardware-simulator.py
      - run: python -m py_compile scripts/package-hardware-simulator.py
      - run: python -m unittest discover -s tests -p test_control_package.py
      - run: python -m unittest discover -s tests -p test_server_package.py
      - run: python -m py_compile scripts/package-windows-server.py scripts/check-server-package.py scripts/check-server-gui.py scripts/check-server-catalog.py
      - run: python -m py_compile scripts/publish-control-server.py scripts/package-control-server.py scripts/check-control-package.py scripts/check-control-report.py scripts/check-control-gui.py
      - run: python -m unittest discover -s tests -p test_pose_trace_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_input_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_heartbeat.py
      - run: python -m unittest discover -s tests -p test_pose_loop_analysis.py
      - run: python -m unittest discover -s tests -p test_pose_process_timing.py
      - run: python -m unittest discover -s tests -p test_desktop_capacity.py
      - run: python -m unittest discover -s tests -p test_desktop_active.py
      - run: python -m unittest discover -s tests -p test_observer_sequence.py
      - run: python -m unittest discover -s tests -p test_observer_analysis.py
      - run: python -m unittest discover -s tests -p test_first_person.py
      - run: python -m unittest discover -s tests -p test_desktop_navigation.py
      - run: python -m unittest discover -s tests -p test_ai_targeting.py
      - run: python -m unittest discover -s tests -p test_desktop_crouch.py
      - run: python -m py_compile scripts/check-desktop-crouch.py
      - run: python -m unittest discover -s tests -p test_desktop_exercise.py
      - run: python -m py_compile scripts/check-desktop-exercise.py
      - run: python -m py_compile scripts/check-desktop-ai-targeting.py
      - run: python -m py_compile scripts/check-desktop-navigation.py
      - run: python -m py_compile scripts/check-desktop-first-person.py
      - run: python -m py_compile scripts/observer-sequence.py scripts/analyze-observer-sequence.py
      - run: python -m unittest discover -s tests -p test_desktop_artifacts.py
      - run: python -m py_compile scripts/start-desktop-demo.py scripts/start-desktop-venue.py scripts/check-desktop-practice.py scripts/check-desktop-pose-input.py scripts/analyze-pose-input.py scripts/pose-heartbeat.py scripts/pose-process-timing.py scripts/analyze-process-timing.py scripts/check-desktop-capacity.py scripts/check-desktop-active.py scripts/check-desktop-debrief.py
      - run: python -m unittest discover -s tests -p test_desktop_debrief.py
      - run: python -m unittest discover -s tests -p test_udp_gate.py
      - run: python -m py_compile scripts/udp_gate.py scripts/check-desktop-end-race.py
      - run: python -m py_compile scripts/check-desktop-clock.py
      - run: python -m unittest discover -s tests -p test_venue_http_gate.py
      - run: python -m py_compile scripts/venue_http_gate.py scripts/check-desktop-clock-faults.py
      - run: python -m unittest discover -s tests -p test_desktop_long.py
      - run: python -m unittest discover -s tests -p test_multiplayer_long.py
      - run: python -m unittest discover -s tests -p test_independent_long.py
      - run: python -m py_compile scripts/check-desktop-independent-long.py
      - run: python -m unittest discover -s tests -p test_continuity_comparison.py
      - run: python -m py_compile scripts/compare-desktop-continuity.py
      - run: python -m unittest discover -s tests -p test_pose_continuity_analysis.py
      - run: python -m py_compile scripts/analyze-pose-continuity.py scripts/check-pose-continuity.py
      - run: python -m py_compile scripts/check-desktop-multiplayer-long.py
      - run: python -m py_compile scripts/check-desktop-long.py scripts/check-desktop-seal-faults.py
      - run: python scripts/generate-weather-audio.py --check
      - run: python scripts/generate-combat-audio.py --check
      - run: python scripts/generate-field-props.py --check
      - run: python scripts/generate-service-rifle.py --check
      - run: python scripts/generate-combatants.py --check
      - run: python scripts/generate-weapon-actions.py --check
      - run: python scripts/generate-armed-combatants.py --check
      - run: python scripts/generate-combat-effects.py --check
      - run: python scripts/generate-player-fire.py --check
      - run: python scripts/generate-player-body.py --check
      - run: python scripts/check-transport-patch.py
      - run: python scripts/check-mission-font.py
      - run: python -m py_compile scripts/check-desktop-briefing.py
      - run: python -m py_compile scripts/check-desktop-readiness.py
      - run: python -m unittest discover -s tests -p test_desktop_external.py
      - run: python -m unittest discover -s tests -p test_player_package.py
      - run: python -m py_compile scripts/package-windows-player.py scripts/check-player-package.py
      - run: python -m py_compile scripts/check-player-connection-status.py
      - run: python -m unittest discover -s tests -p test_player_config_review.py
      - run: python -m py_compile scripts/check-player-config-review.py
      - run: python -m unittest discover -s tests -p test_desktop_startup.py
      - run: python -m unittest discover -s tests -p test_admission_witness.py
      - run: python -m unittest discover -s tests -p test_world_journal_analysis.py
      - run: python -m unittest discover -s tests -p test_independent_evidence.py
      - run: python -m py_compile scripts/verify-independent-evidence.py
      - run: python -m unittest discover -s tests -p test_publication_timing.py
      - run: python -m unittest discover -s tests -p test_journal_stages.py
      - run: python -m py_compile scripts/analyze-journal-stages.py
      - run: python -m py_compile scripts/analyze-publication-timing.py
      - run: python -m py_compile scripts/analyze-world-journal.py
      - run: python -m py_compile scripts/admission_witness.py scripts/check-unity-admission.py
      - run: python -m py_compile scripts/check-desktop-startup.py
      - run: python -m py_compile scripts/start-desktop-control.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tests/browser/check-closure-native.cjs
      - run: node --check tests/browser/check-external-native.cjs
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tests/browser install --frozen-lockfile
      - run: pnpm --dir tests/browser exec playwright install --with-deps chromium
      - run: pnpm --dir tests/browser test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: artifacts/console/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-pipe-evidence
          path: |
            artifacts/control-pipe/*/*.log
            artifacts/control-pipe/*/*-status.json
            artifacts/control-pipe/*/checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-simulator-evidence
          path: |
            artifacts/hardware-simulator/*/*.log
            artifacts/hardware-simulator/*/checks.json
            artifacts/hardware-simulator/*/cleanup.json
            artifacts/hardware-simulator/*/simulation-report.json
            artifacts/hardware-simulator/*/fault-report.json
            artifacts/hardware-simulator/*/simulation-input.json
            artifacts/hardware-simulator/*/fault-input.json
            artifacts/hardware-simulator/*/source-events.json
            artifacts/hardware-simulator/*/source-session.json
            artifacts/hardware-simulator/*/source-statistics.json
          if-no-files-found: ignore
