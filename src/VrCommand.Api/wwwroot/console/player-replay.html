<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VR COMMAND｜玩家任務回放</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./console.css">
  <script type="module" src="./player-replay.js"></script>
</head>
<body>
  <header class="masthead"><div><p class="eyebrow">VR COMMAND / REPLAY</p><h1>玩家任務回放</h1></div></header>
  <main>
    <!--player-replay-data-->
    <section class="panel" aria-label="載入回放">
      <label>場館提供的回放檔（可多選同場連續片段）<input id="player-replay-file" type="file" accept=".json,application/json" multiple></label>
      <p class="hint">檔案只在此瀏覽器開啟，不會上傳至管理服務。</p>
      <p id="player-replay-message" role="status">請選擇回放檔。</p>
    </section>
    <section id="player-replay-view" class="panel" aria-label="回放畫面" hidden>
      <h2 id="player-replay-title"></h2>
      <p id="player-replay-source" class="muted"></p>
      <label id="player-replay-previous" hidden><span id="player-replay-previous-label"></span><input id="player-replay-previous-file" type="file" accept=".html,text/html"></label>
      <label id="player-replay-continuation" hidden><span id="player-replay-volume-label"></span><input id="player-replay-volume-file" type="file" accept=".html,text/html"></label>
      <label id="player-replay-segment-field" hidden>跳到片段起點<select id="player-replay-segment"></select></label>
      <div id="replay-viewport">
        <canvas id="replay-canvas" tabindex="0" aria-label="回放 3D 場景，可拖曳旋轉、方向鍵平移及滾輪縮放"></canvas>
        <div class="replay-overlay"><span id="player-replay-weather"></span><span id="player-replay-frame"></span></div>
      </div>
      <div class="replay-transport">
        <button id="player-replay-play" type="button">播放</button>
        <button id="player-replay-back" class="quiet" type="button">上一格</button>
        <button id="player-replay-next" class="quiet" type="button">下一格</button>
        <label>速度<select id="player-replay-speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <label>視角<select id="player-replay-room"></select></label>
        <label class="check"><input id="player-replay-loop" type="checkbox">循環播放</label>
        <output id="player-replay-time" role="timer" aria-live="off"></output>
        <output id="player-replay-clock" hidden></output>
      </div>
      <div class="replay-transport replay-follow-tools">
        <label>跟隨玩家<select id="player-replay-follow"></select></label>
        <output id="player-replay-follow-status" role="status"></output>
        <button id="player-replay-follow-back" class="quiet" type="button" hidden>回到玩家上次入鏡</button>
        <button id="player-replay-follow-next" class="quiet" type="button" hidden>跳到玩家下次入鏡</button>
      </div>
      <label>時間軸<input id="replay-timeline" type="range" min="0" value="0" step="1"></label>
      <details>
        <summary>觀看書籤</summary>
        <p class="hint">儲存目前的畫格、房間與鏡頭。下次開啟包含這一格的回放檔後，讀取書籤即可接續觀看。</p>
        <div class="replay-transport">
          <button id="player-replay-save-bookmark" type="button" class="quiet">儲存觀看書籤</button>
          <label>讀取觀看書籤<input id="player-replay-bookmark-file" type="file" accept=".json,application/json"></label>
          <output id="player-replay-bookmark-status" role="status"></output>
        </div>
      </details>
      <form id="player-replay-seek" class="replay-transport">
        <label><span>片段時間（秒）</span><input id="player-replay-seconds" type="number" inputmode="decimal" min="0" step="0.001" required></label>
        <button type="submit" class="quiet">跳到時間</button>
      </form>
      <form id="player-replay-jump" class="replay-transport">
        <label><span>畫格序號</span><input id="player-replay-number" type="number" inputmode="numeric" min="1" step="1" required></label>
        <button type="submit" class="quiet">跳到畫格</button>
      </form>
      <form id="player-replay-activity-seek" class="replay-transport" hidden>
        <label><span>任務活動時間（秒）</span><input id="player-replay-activity-seconds" type="number" inputmode="decimal" step="0.05" required aria-describedby="player-replay-activity-range"></label>
        <button type="submit" class="quiet">跳到任務時間</button>
        <span id="player-replay-activity-range" class="hint"></span>
      </form>
      <label id="player-replay-transition-field" hidden>遊戲來源畫格<select id="player-replay-transition"></select></label>
      <label id="player-replay-environment-field" hidden>環境變化<select id="player-replay-environment"></select></label>
      <div class="replay-transport replay-event-tools">
        <label>戰鬥事件<select id="player-replay-event-kind"><option value="">所有類型</option></select></label>
        <button id="player-replay-event-back" type="button" class="quiet" disabled>上一個事件畫格</button>
        <button id="player-replay-event-next" type="button" class="quiet" disabled>下一個事件畫格</button>
        <output id="player-replay-event-count" role="status"></output>
      </div>
      <p id="player-replay-event-frame" class="hint" hidden></p>
    </section>
  </main>
</body>
</html>
